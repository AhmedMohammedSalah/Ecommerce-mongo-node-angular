<div class="category-filter">
  <!-- Title -->
  <div class="category-filter-header">
    <h4><i class="fas fa-filter me-2"></i> Category Filter</h4>
  </div>

  <!-- Category List -->
  <div class="list-group">
    <button class="list-group-item list-group-item-action d-flex align-items-center" *ngFor="let cat of categories"
      (click)="onSelectCategory(cat._id)">
      <i class="fas fa-folder me-3"></i> <!-- FontAwesome folder icon -->
      <span class="flex-grow-1">{{ cat.name }}</span>
      <i class="fas fa-chevron-right"></i> <!-- FontAwesome chevron icon -->
    </button>
  </div>
</div>
