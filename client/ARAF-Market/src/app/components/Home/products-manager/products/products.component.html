<div class="container">
  <!-- Search Filter at the Top -->
  <div class="row mt-4">
    <div class="col-12">
      <app-search></app-search> <!-- Moved to the top -->
    </div>
  </div>

  <div class="row mt-4">
    <!-- Collapsible Filters for Small Screens -->
    <div class="col-12 d-block d-md-none mb-3">
      <button class="btn btn-primary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#filtersCollapse"
        aria-expanded="false" aria-controls="filtersCollapse">
        <i class="fas fa-filter me-2"></i> Filters
      </button>
      <div class="collapse mt-2" id="filtersCollapse">
        <app-category></app-category>
        <app-price-filter></app-price-filter>
      </div>
    </div>

    <!-- Sidebar for filters (Visible on Medium and Larger Screens) -->
    <div class="col-md-3 d-none d-md-block">
      <app-category></app-category>
      <app-price-filter></app-price-filter>
    </div>

    <!-- Main content for product listing -->
    <div class="col-md-9">
       <app-product-list></app-product-list>
    </div>
  </div>
</div>
