<div class="container py-5">
  <h2 class="mb-4">
    <i class="fas fa-heart me-2 text-danger"></i>Your Wishlist
  </h2>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="d-flex justify-content-center my-5">
    <app-loading></app-loading>
  </div>

  <!-- Empty Wishlist Message -->
  <div *ngIf="!isLoading && wishlistItems.length === 0" class="alert alert-info">
    Your wishlist is empty. Start adding your favorite products!
  </div>

  <!-- Wishlist Items -->
  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let item of wishlistItems">
      <div class="card h-100 shadow-sm">
          <a [routerLink]="['/product-details', item._id]" class="text-decoration-none text-dark">
          <img [src]="'http://127.0.0.1:3000/' + item.imagePath" class="card-img-top" alt="Product image"
          style="height: 200px; object-fit: cover;">
        </a>
          <div class="card-body">
            <h5 class="card-title">{{ item.productName }}</h5>
            <p class="card-text small text-muted">{{ item.description }}</p>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <!-- Prices -->
              <div class="price-section">
                <span class="new-price text-danger fw-bold">${{ item.price }}</span>
                <span *ngIf="item.discount" class="old-price text-muted text-decoration-line-through ms-2">
                  ${{ item.price + (item.price * item.discount / 100) }}
                </span>
              </div>
              <!-- Remove Button -->
              <button class="btn btn-outline-danger btn-sm"
                (click)="removeFromWishlist(item._id); $event.preventDefault()">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
    </div>
  </div>
</div>
