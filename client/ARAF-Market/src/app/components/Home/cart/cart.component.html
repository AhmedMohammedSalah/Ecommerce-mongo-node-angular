<div class="container py-5">
  <h2 class="mb-4">
    <i class="fas fa-shopping-cart me-2"></i>Your Cart
  </h2>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading">
    <div *ngIf="cartItems.length === 0" class="alert alert-info">
      Your cart is empty
    </div>

    <div *ngFor="let item of cartItems" class="card mb-3">
      <div class="row g-0">
        <div class="col-md-3">
          <img [src]="item.image" class="img-fluid rounded-start" alt="Product image">
        </div>
        <div class="col-md-9">
          <div class="card-body">
            <h5 class="card-title">{{ item.productName }}</h5>
            <div class="d-flex justify-content-between align-items-center">
              <div class="quantity-control">
                <button class="btn btn-outline-secondary" (click)="updateQuantity(item, item.quantity - 1)"
                  [disabled]="item.quantity <= 1">
                  <i class="fas fa-minus"></i>
                </button>
                <span class="mx-3">{{ item.quantity }}</span>
                <button class="btn btn-outline-secondary" (click)="updateQuantity(item, item.quantity + 1)"
                  [disabled]="item.quantity >= item.stockQuantity">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
              <div>
                <h4 class="text-primary">{{ item.price * item.quantity | currency }}</h4>
                <button class="btn btn-danger" (click)="removeItem(item.productId)">
                  <i class="fas fa-trash"></i> Remove
                </button>
              </div>
            </div>
            <div class="text-muted mt-2">
              Stock available: {{ item.stockQuantity }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
