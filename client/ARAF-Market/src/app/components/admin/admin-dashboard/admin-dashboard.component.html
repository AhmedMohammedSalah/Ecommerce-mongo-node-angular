

   <div class="dashboard-container">
    <!-- القائمة الجانبية -->
    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav mode="side" opened class="sidenav" disableClose>
        <h3 class="sidebar-title">Admin Panel</h3>
        <mat-nav-list>
          <a mat-list-item routerLink="/admin/orders" routerLinkActive="active">
            <mat-icon>receipt</mat-icon> Manage Orders
          </a>
          <a mat-list-item routerLink="/admin/users" routerLinkActive="active">
            <mat-icon>people</mat-icon> Manage Users
          </a>
          <a mat-list-item routerLink="/admin/products" routerLinkActive="active">
            <mat-icon>inventory</mat-icon> Manage Products
          </a>
          <a mat-list-item routerLink="/admin/balance" routerLinkActive="active">
            <mat-icon>account_balance</mat-icon> Balance
          </a>
          <a mat-list-item (click)="logout()">
            <mat-icon>logout</mat-icon> Logout
          </a>
        </mat-nav-list>
      </mat-sidenav>
  


      <mat-sidenav-content class="content">
        <router-outlet></router-outlet>
          </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
