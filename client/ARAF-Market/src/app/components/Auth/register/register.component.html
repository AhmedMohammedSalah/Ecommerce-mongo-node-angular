<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="p-4 border rounded bg-white shadow-sm" style="max-width: 400px; margin: auto;">
  <div class="mb-3">
    <label class="form-label"><i class="fas fa-user-tag"></i> Role</label>
    <select formControlName="role" class="form-control">
      <option value="user">User</option>
      <option value="seller">Seller</option>
    </select>
    <div *ngIf="(registerForm.controls['role'].invalid && registerForm.controls['role'].touched) || (submitted && registerForm.controls['role'].invalid)" class="text-danger">
      Role is required.
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label"><i class="fas fa-user"></i> Name</label>
    <input type="text" formControlName="name" class="form-control"> 
    <div *ngIf="(registerForm.controls['name'].invalid && registerForm.controls['name'].touched) || (submitted && registerForm.controls['name'].invalid)" class="text-danger">
      Name is required (min 3 characters).
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
    <input type="email" formControlName="email" class="form-control">
    <div *ngIf="(registerForm.controls['email'].invalid && registerForm.controls['email'].touched) || (submitted && registerForm.controls['email'].invalid)" class="text-danger">
      Enter a valid email.
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
    <input type="password" formControlName="password" class="form-control">
    <div *ngIf="(registerForm.controls['password'].invalid && registerForm.controls['password'].touched) || (submitted && registerForm.controls['password'].invalid)" class="text-danger">
      Password must be at least 6 characters.
    </div>
  </div>

  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting"><i class="fas fa-user-plus"></i> Register</button>
    <button type="button" class="btn btn-warning" (click)="onReset()"><i class="fas fa-redo"></i> Reset</button>
  </div>
</form>
