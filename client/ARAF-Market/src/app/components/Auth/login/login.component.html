<!-- (FM) Edit -->

<!-- Bind the form to the reactive FormGroup and trigger the onLogin() method when the form is submitted -->
<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <!-- Email -->
  <div class="mb-3">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      class="form-control"
      [formControl]="loginForm.controls.email"
    />
    <div
      class="text-danger"
      [hidden]="
        loginForm.controls.email.valid || loginForm.controls.email.pristine
      "
    >
      Valid email required.
    </div>
  </div>

  <!-- Password -->
  <div class="mb-3">
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      class="form-control"
      [formControl]="loginForm.controls.password"
    />
    <div
      class="text-danger"
      [hidden]="
        loginForm.controls.password.valid ||
        loginForm.controls.password.pristine
      "
    >
      Minimum 6 characters required.
    </div>
  </div>

  <!-- Role -->
  <div class="mb-3">
    <label for="role">Role</label>
    <select
      id="role"
      class="form-select"
      [formControl]="loginForm.controls.role"
    >
      <option value="" disabled>Select role</option>
      <option value="customer">Customer</option>
      <option value="seller">Seller</option>
      <option value="admin">Admin</option>
    </select>
    <div
      class="text-danger"
      [hidden]="
        loginForm.controls.role.valid || loginForm.controls.role.pristine
      "
    >
      Role is required.
    </div>
  </div>

  <!-- Error -->
  <div class="alert alert-danger" [hidden]="!errorMessage">
    {{ errorMessage }}
  </div>

  <!-- Submit -->
  <button
    class="btn btn-dark w-100"
    type="submit"
    [disabled]="loginForm.invalid || loading"
  >
    {{ loading ? "Logging in..." : "Login" }}
  </button>
</form>
