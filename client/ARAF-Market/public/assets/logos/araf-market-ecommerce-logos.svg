<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4158D0" />
      <stop offset="100%" style="stop-color:#C850C0" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2027" />
      <stop offset="50%" style="stop-color:#203A43" />
      <stop offset="100%" style="stop-color:#2C5364" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43cea2" />
      <stop offset="100%" style="stop-color:#185a9d" />
    </linearGradient>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4e50" />
      <stop offset="100%" style="stop-color:#f9d423" />
    </linearGradient>
  </defs>
  
  <!-- Design 1: Premium E-commerce with Shopping Cart Focus -->
  <g transform="translate(100, 100)">
    <!-- Logo Background with Soft Shadow -->
    <rect x="0" y="0" width="250" height="250" rx="20" fill="url(#gradient1)" filter="drop-shadow(5px 5px 10px rgba(0,0,0,0.3))" />
    
    <!-- Letters -->
    <text x="125" y="140" font-family="Montserrat, sans-serif" font-size="85" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-4">A</text>
    <text x="125" y="175" font-family="Montserrat, sans-serif" font-size="30" font-weight="300" fill="white" text-anchor="middle" letter-spacing="4">RAF</text>
    
    <!-- Enhanced Shopping Cart Icon -->
    <g transform="translate(125, 85) scale(1.5)">
      <path d="M-25,-10 L5,-10 L10,10 L-20,10 Z" fill="white" opacity="0.9"/>
      <circle cx="-15" cy="15" r="5" fill="white" opacity="0.9"/>
      <circle cx="0" cy="15" r="5" fill="white" opacity="0.9"/>
      <path d="M-25,-20 L-30,-25" stroke="white" stroke-width="2" opacity="0.9"/>
      <path d="M-25,-20 L-20,-25" stroke="white" stroke-width="2" opacity="0.9"/>
    </g>
    
    <!-- Title with E-commerce Tagline -->
    <text x="125" y="220" font-family="Montserrat, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle" letter-spacing="2">ARAF-MARKET</text>
    <text x="125" y="238" font-family="Montserrat, sans-serif" font-size="10" font-weight="300" fill="white" text-anchor="middle" letter-spacing="1">BUY · SELL · TRACK</text>
  </g>
  
  <!-- Design 2: Dark Theme with Tracking & Cart Icons -->
  <g transform="translate(450, 100)">
    <!-- Logo Background - Dark Sleek -->
    <rect x="0" y="0" width="250" height="250" rx="5" fill="url(#gradient2)" />
    
    <!-- Letters -->
    <g transform="translate(125, 125)">
      <text x="0" y="0" font-family="Helvetica Neue, sans-serif" font-size="75" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="0" y="35" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="500" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="5">RAF</text>
    </g>
    
    <!-- E-commerce Icons -->
    <g transform="translate(50, 50)">
      <!-- Shopping Cart -->
      <path d="M0,0 L25,0 L30,20 L5,20 Z" fill="white" opacity="0.7"/>
      <circle cx="10" cy="25" r="3" fill="white" opacity="0.7"/>
      <circle cx="25" cy="25" r="3" fill="white" opacity="0.7"/>
    </g>
    
    <g transform="translate(190, 50)">
      <!-- Package/Delivery -->
      <rect x="-15" y="-10" width="30" height="25" fill="white" opacity="0.7"/>
      <path d="M-15,-10 L0,-20 L15,-10" fill="white" opacity="0.7"/>
      <path d="M0,-20 L0,15" stroke="white" stroke-width="1" opacity="0.7"/>
    </g>
    
    <g transform="translate(125, 50)">
      <!-- Search/Browse -->
      <circle cx="0" cy="0" r="10" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
      <path d="M7,7 L15,15" stroke="white" stroke-width="2" opacity="0.7"/>
    </g>
    
    <!-- Tracking Path -->
    <path d="M25,180 C50,170 75,190 100,180 C125,170 150,190 175,180 C200,170 225,190 250,180" fill="none" stroke="white" stroke-width="2" opacity="0.5" stroke-dasharray="2,2"/>
    <circle cx="25" cy="180" r="3" fill="white" opacity="0.7"/>
    <circle cx="250" cy="180" r="3" fill="white" opacity="0.7"/>
    
    <!-- Title with E-commerce Tagline -->
    <text x="125" y="220" font-family="Helvetica Neue, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">ARAF-MARKET</text>
    <text x="125" y="238" font-family="Helvetica Neue, sans-serif" font-size="10" font-weight="300" fill="white" text-anchor="middle">ONLINE MARKETPLACE</text>
  </g>
  
  <!-- Design 3: Circular with E-commerce Integration -->
  <g transform="translate(100, 400)">
    <!-- Circular Background with Subtle Gradient -->
    <circle cx="125" cy="125" r="125" fill="url(#gradient3)" />
    
    <!-- Letters -->
    <text x="125" y="115" font-family="Futura, sans-serif" font-size="70" font-weight="700" fill="white" text-anchor="middle">A</text>
    <text x="125" y="150" font-family="Futura, sans-serif" font-size="25" font-weight="500" fill="white" text-anchor="middle" letter-spacing="3">RAF</text>
    
    <!-- E-commerce Icons Around Circle -->
    <g transform="translate(125, 125)">
      <!-- Shopping Cart at Top -->
      <g transform="translate(0, -80)">
        <path d="M-10,-5 L10,-5 L7,5 L-7,5 Z" fill="white" opacity="0.8"/>
        <circle cx="-5" cy="10" r="3" fill="white" opacity="0.8"/>
        <circle cx="5" cy="10" r="3" fill="white" opacity="0.8"/>
      </g>
      
      <!-- Package/Delivery at Right -->
      <g transform="translate(80, 0)">
        <rect x="-7" y="-7" width="14" height="14" fill="white" opacity="0.8"/>
        <path d="M-7,-7 L0,-12 L7,-7" fill="white" opacity="0.8"/>
      </g>
      
      <!-- Mobile Device at Bottom -->
      <g transform="translate(0, 80)">
        <rect x="-5" y="-10" width="10" height="18" rx="2" fill="white" opacity="0.8"/>
        <rect x="-3" y="-8" width="6" height="10" fill="none" stroke="white" stroke-width="0.5" opacity="0.8"/>
        <circle cx="0" cy="5" r="1" fill="white" opacity="0.8"/>
      </g>
      
      <!-- Price Tag at Left -->
      <g transform="translate(-80, 0)">
        <path d="M-7,-7 L7,7 L3,12 L-12,3 Z" fill="white" opacity="0.8"/>
        <circle cx="-2" cy="-2" r="2" fill="url(#gradient3)" opacity="0.8"/>
      </g>
      
      <!-- Connecting Circular Path -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="white" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
    </g>
    
    <!-- Title with E-commerce Tagline -->
    <text x="125" y="220" font-family="Futura, sans-serif" font-size="18" font-weight="500" fill="white" text-anchor="middle" letter-spacing="2">ARAF-MARKET</text>
    <text x="125" y="238" font-family="Futura, sans-serif" font-size="10" font-weight="300" fill="white" text-anchor="middle">SHOP · TRACK · DELIVER</text>
  </g>
  
  <!-- Design 4: Geometric with E-commerce Elements -->
  <g transform="translate(450, 400)">
    <!-- Logo Background - Gradient Geometric -->
    <path d="M125,0 L250,75 L250,175 L125,250 L0,175 L0,75 Z" fill="url(#gradient4)" filter="drop-shadow(5px 5px 10px rgba(0,0,0,0.2))" />
    
    <!-- Letters -->
    <text x="125" y="125" font-family="Avenir, sans-serif" font-size="65" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>
    <text x="125" y="160" font-family="Avenir, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="3">RAF</text>
    
    <!-- E-commerce Icon Integration -->
    <g transform="translate(125, 60)">
      <!-- Primary Shopping Cart -->
      <path d="M-20,-10 L20,-10 L15,15 L-15,15 Z" fill="white" opacity="0.9"/>
      <circle cx="-10" cy="20" r="5" fill="white" opacity="0.9"/>
      <circle cx="10" cy="20" r="5" fill="white" opacity="0.9"/>
      
      <!-- Cart Items -->
      <rect x="-12" y="-5" width="8" height="5" fill="url(#gradient4)" opacity="0.9"/>
      <rect x="-2" y="-7" width="4" height="7" fill="url(#gradient4)" opacity="0.9"/>
      <rect x="5" y="-3" width="10" height="3" fill="url(#gradient4)" opacity="0.9"/>
    </g>
    
    <!-- Tracking Elements at Bottom -->
    <g transform="translate(125, 200)">
      <path d="M-50,-10 C-30,-5 -10,-15 10,-5 C30,5 50,-5 70,0" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
      <circle cx="-50" cy="-10" r="3" fill="white"/>
      <circle cx="10" cy="-5" r="3" fill="white"/>
      <circle cx="70" cy="0" r="3" fill="white"/>
    </g>
    
    <!-- Title with E-commerce Tagline -->
    <text x="125" y="275" font-family="Avenir, sans-serif" font-size="18" font-weight="600" fill="#333333" text-anchor="middle" letter-spacing="1">ARAF-MARKET</text>
    <text x="125" y="293" font-family="Avenir, sans-serif" font-size="10" font-weight="400" fill="#333333" text-anchor="middle">THE COMPLETE MARKETPLACE</text>
  </g>
  
  <!-- Design 5: Luxury E-commerce Platform -->
  <g transform="translate(800, 100)">
    <!-- Luxury Circle Background -->
    <circle cx="125" cy="125" r="120" fill="#1A1A1A" />
    <circle cx="125" cy="125" r="115" fill="none" stroke="#DFBD69" stroke-width="2" />
    <circle cx="125" cy="125" r="100" fill="none" stroke="#DFBD69" stroke-width="1" />
    
    <!-- Luxury A -->
    <g transform="translate(125, 130)">
      <text x="0" y="0" font-family="Didot, serif" font-size="90" font-weight="normal" fill="#DFBD69" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="0" y="35" font-family="Didot, serif" font-size="18" font-weight="normal" fill="#DFBD69" text-anchor="middle" dominant-baseline="middle" letter-spacing="10">RAF</text>
    </g>
    
    <!-- Premium Shopping Experience Icons -->
    <g transform="translate(125, 60)">
      <!-- Crown/Premium Symbol -->
      <path d="M0,-15 L15,0 L0,5 L-15,0 Z" fill="#DFBD69" opacity="0.9"/>
      <circle cx="-15" cy="0" r="2" fill="#DFBD69"/>
      <circle cx="0" cy="-15" r="2" fill="#DFBD69"/>
      <circle cx="15" cy="0" r="2" fill="#DFBD69"/>
      <rect x="-12" y="7" width="24" height="3" fill="#DFBD69"/>
    </g>
    
    <!-- Luxury Shopping Elements -->
    <path d="M60,125 A 65 65 0 0 1 125,60" stroke="#DFBD69" stroke-width="1" opacity="0.6" fill="none"/>
    <path d="M190,125 A 65 65 0 0 1 125,190" stroke="#DFBD69" stroke-width="1" opacity="0.6" fill="none"/>
    <path d="M125,60 A 65 65 0 0 1 190,125" stroke="#DFBD69" stroke-width="1" opacity="0.6" fill="none" stroke-dasharray="2,3"/>
    <path d="M125,190 A 65 65 0 0 1 60,125" stroke="#DFBD69" stroke-width="1" opacity="0.6" fill="none" stroke-dasharray="2,3"/>
    
    <!-- Small Shopping Bag at Bottom -->
    <g transform="translate(125, 190)">
      <path d="M-10,-5 L10,-5 L7,10 L-7,10 Z" fill="#DFBD69" opacity="0.8"/>
      <path d="M-5,-5 L-5,-12 C-5,-15 5,-15 5,-12 L5,-5" fill="none" stroke="#DFBD69" stroke-width="1"/>
    </g>
    
    <!-- Title with Luxury E-commerce Tagline -->
    <text x="125" y="245" font-family="Didot, serif" font-size="18" font-weight="normal" fill="#DFBD69" text-anchor="middle" letter-spacing="3">ARAF-MARKET</text>
    <text x="125" y="263" font-family="Didot, serif" font-size="10" font-weight="normal" fill="#DFBD69" text-anchor="middle" letter-spacing="1">PREMIUM MARKETPLACE</text>
  </g>
  
  <!-- Design 6: Modern Complete E-commerce Hub -->
  <g transform="translate(800, 400)">
    <!-- Clean Background -->
    <rect x="0" y="0" width="250" height="250" rx="10" fill="#FFFFFF" filter="drop-shadow(0px 5px 15px rgba(0,0,0,0.15))" />
    
    <!-- E-commerce Hub Icon -->
    <g transform="translate(125, 60)">
      <circle cx="0" cy="0" r="25" fill="#333333"/>
      <path d="M-15,-5 L5,-5 L0,10 L-10,10 Z" fill="white" opacity="0.9"/>
      <circle cx="-7" cy="15" r="3" fill="white" opacity="0.9"/>
      <circle cx="-2" cy="15" r="3" fill="white" opacity="0.9"/>
    </g>
    
    <!-- Integrated Letters -->
    <g transform="translate(125, 125)">
      <text x="-75" y="0" font-family="Raleway, sans-serif" font-size="60" font-weight="700" fill="#333333" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="-25" y="0" font-family="Raleway, sans-serif" font-size="60" font-weight="300" fill="#666666" text-anchor="middle" dominant-baseline="middle">R</text>
      <text x="25" y="0" font-family="Raleway, sans-serif" font-size="60" font-weight="700" fill="#333333" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="75" y="0" font-family="Raleway, sans-serif" font-size="60" font-weight="300" fill="#666666" text-anchor="middle" dominant-baseline="middle">F</text>
    </g>
    
    <!-- E-commerce Service Icons -->
    <g transform="translate(55, 185)">
      <!-- Browse Icon -->
      <circle cx="0" cy="0" r="12" fill="#f2f2f2" stroke="#333333" stroke-width="1"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#333333" stroke-width="1"/>
      <path d="M5,5 L10,10" stroke="#333333" stroke-width="1.5"/>
    </g>
    
    <g transform="translate(125, 185)">
      <!-- Cart Icon -->
      <circle cx="0" cy="0" r="12" fill="#f2f2f2" stroke="#333333" stroke-width="1"/>
      <path d="M-6,-3 L2,-3 L1,3 L-5,3 Z" fill="#333333"/>
      <circle cx="-4" cy="5" r="1.5" fill="#333333"/>
      <circle cx="0" cy="5" r="1.5" fill="#333333"/>
    </g>
    
    <g transform="translate(195, 185)">
      <!-- Tracking Icon -->
      <circle cx="0" cy="0" r="12" fill="#f2f2f2" stroke="#333333" stroke-width="1"/>
      <path d="M-5,-3 C-2,0 2,-2 5,0" fill="none" stroke="#333333" stroke-width="1.5"/>
      <circle cx="-5" cy="-3" r="1.5" fill="#333333"/>
      <circle cx="5" cy="0" r="1.5" fill="#333333"/>
    </g>
    
    <!-- Title with E-commerce Tagline -->
    <text x="125" y="225" font-family="Raleway, sans-serif" font-size="18" font-weight="600" fill="#333333" text-anchor="middle">ARAF-MARKET</text>
    <text x="125" y="240" font-family="Raleway, sans-serif" font-size="10" font-weight="400" fill="#666666" text-anchor="middle">BROWSE · BUY · TRACK</text>
  </g>
</svg>
