<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- Design 1: Premium Minimalist with Gradient -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4158D0" />
      <stop offset="100%" style="stop-color:#C850C0" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2027" />
      <stop offset="50%" style="stop-color:#203A43" />
      <stop offset="100%" style="stop-color:#2C5364" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43cea2" />
      <stop offset="100%" style="stop-color:#185a9d" />
    </linearGradient>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4e50" />
      <stop offset="100%" style="stop-color:#f9d423" />
    </linearGradient>
  </defs>
  
  <!-- Design 1: Premium Minimalist with Gradient -->
  <g transform="translate(100, 100)">
    <!-- Logo Background with Soft Shadow -->
    <rect x="0" y="0" width="250" height="250" rx="20" fill="url(#gradient1)" filter="drop-shadow(5px 5px 10px rgba(0,0,0,0.3))" />
    
    <!-- Letters - Elegant Styling -->
    <text x="125" y="130" font-family="Montserrat, sans-serif" font-size="90" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-4">A</text>
    <text x="125" y="170" font-family="Montserrat, sans-serif" font-size="30" font-weight="300" fill="white" text-anchor="middle" letter-spacing="4">RAF</text>
    
    <!-- Modern Shopping Cart Icon -->
    <path d="M175,60 C175,60 190,60 190,75 L190,80 C190,80 180,80 180,90 L140,90 L150,65 L175,60 Z" fill="white" opacity="0.8"/>
    <circle cx="165" cy="100" r="6" fill="white" opacity="0.8"/>
    <circle cx="145" cy="100" r="6" fill="white" opacity="0.8"/>
    
    <!-- Title - Elegant Typography -->
    <text x="125" y="230" font-family="Montserrat, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle" letter-spacing="2">ARAF-MARKET</text>
  </g>
  
  <!-- Design 2: Professional Dark Theme -->
  <g transform="translate(450, 100)">
    <!-- Logo Background - Dark Sleek -->
    <rect x="0" y="0" width="250" height="250" rx="5" fill="url(#gradient2)" />
    
    <!-- Horizontal Line Elements -->
    <rect x="25" y="40" width="200" height="3" fill="#ffffff" opacity="0.4" />
    <rect x="25" y="205" width="200" height="3" fill="#ffffff" opacity="0.4" />
    
    <!-- Letters - Bold Professional Style -->
    <g transform="translate(125, 125)">
      <text x="0" y="0" font-family="Helvetica Neue, sans-serif" font-size="75" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="0" y="35" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="500" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="5">RAF</text>
    </g>
    
    <!-- Abstract Track Lines (Representing Order Tracking) -->
    <path d="M25,60 C50,60 50,80 75,80 C100,80 100,60 125,60 C150,60 150,80 175,80 C200,80 200,60 225,60" fill="none" stroke="white" stroke-width="2" opacity="0.4" />
    <path d="M25,180 C50,180 50,160 75,160 C100,160 100,180 125,180 C150,180 150,160 175,160 C200,160 200,180 225,180" fill="none" stroke="white" stroke-width="2" opacity="0.4" />
    
    <!-- Title - Corporate Professional -->
    <text x="125" y="230" font-family="Helvetica Neue, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">ARAF-MARKET</text>
  </g>
  
  <!-- Design 3: Dynamic Circular Premium -->
  <g transform="translate(100, 400)">
    <!-- Circular Background with Subtle Gradient -->
    <circle cx="125" cy="125" r="125" fill="url(#gradient3)" />
    
    <!-- Dynamic Circular Paths -->
    <circle cx="125" cy="125" r="100" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
    <circle cx="125" cy="125" r="90" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
    <circle cx="125" cy="125" r="80" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
    <circle cx="125" cy="125" r="70" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
    
    <!-- Centered Elegant Circle -->
    <circle cx="125" cy="125" r="60" fill="white" opacity="0.1" />
    
    <!-- Letters - Elegant Styling -->
    <text x="125" y="115" font-family="Futura, sans-serif" font-size="70" font-weight="700" fill="white" text-anchor="middle">A</text>
    <text x="125" y="150" font-family="Futura, sans-serif" font-size="25" font-weight="500" fill="white" text-anchor="middle" letter-spacing="3">RAF</text>
    
    <!-- Subtle Package Icon -->
    <path d="M160,80 L180,90 L160,100 L140,90 Z" fill="white" opacity="0.6" />
    <path d="M160,80 L140,90 L160,100 L160,120 L140,110 L140,90 Z" fill="white" opacity="0.4" />
    <path d="M160,80 L180,90 L180,110 L160,120 L160,100 Z" fill="white" opacity="0.5" />
    
    <!-- Title - Elegant Typography -->
    <text x="125" y="265" font-family="Futura, sans-serif" font-size="18" font-weight="500" fill="white" text-anchor="middle" letter-spacing="2">ARAF-MARKET</text>
  </g>
  
  <!-- Design 4: Premium Geometric -->
  <g transform="translate(450, 400)">
    <!-- Logo Background - Gradient Geometric -->
    <path d="M125,0 L250,75 L250,175 L125,250 L0,175 L0,75 Z" fill="url(#gradient4)" filter="drop-shadow(5px 5px 10px rgba(0,0,0,0.2))" />
    
    <!-- Inner Geometric Shapes -->
    <path d="M125,40 L210,95 L210,155 L125,210 L40,155 L40,95 Z" fill="white" opacity="0.1" />
    <path d="M125,70 L180,105 L180,145 L125,180 L70,145 L70,105 Z" fill="white" opacity="0.1" />
    
    <!-- Letters - Premium Geometric Style -->
    <text x="125" y="125" font-family="Avenir, sans-serif" font-size="65" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>
    <text x="125" y="160" font-family="Avenir, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="3">RAF</text>
    
    <!-- Subtle Market Icon -->
    <path d="M170,90 A 20 20 0 0 1 150,70 A 20 20 0 0 1 130,90" fill="none" stroke="white" stroke-width="3" opacity="0.7" />
    <path d="M130,90 L170,90 L165,110 L135,110 Z" fill="white" opacity="0.7" />
    
    <!-- Title - Premium Typography -->
    <text x="125" y="280" font-family="Avenir, sans-serif" font-size="18" font-weight="600" fill="#333333" text-anchor="middle" letter-spacing="1">ARAF-MARKET</text>
  </g>
  
  <!-- Design 5: Ultra Premium Lettermark -->
  <g transform="translate(800, 100)">
    <!-- Luxury Circle Background -->
    <circle cx="125" cy="125" r="120" fill="#1A1A1A" />
    <circle cx="125" cy="125" r="115" fill="none" stroke="#DFBD69" stroke-width="2" />
    <circle cx="125" cy="125" r="100" fill="none" stroke="#DFBD69" stroke-width="1" />
    
    <!-- Luxury A -->
    <g transform="translate(125, 125) scale(0.85)">
      <text x="0" y="0" font-family="Didot, serif" font-size="100" font-weight="normal" fill="#DFBD69" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="0" y="30" font-family="Didot, serif" font-size="18" font-weight="normal" fill="#DFBD69" text-anchor="middle" dominant-baseline="middle" letter-spacing="10">RAF</text>
    </g>
    
    <!-- Luxury Elements -->
    <path d="M125,45 L125,55 M125,195 L125,205" stroke="#DFBD69" stroke-width="1" />
    <path d="M45,125 L55,125 M195,125 L205,125" stroke="#DFBD69" stroke-width="1" />
    
    <!-- Title - Luxury Typography -->
    <text x="125" y="265" font-family="Didot, serif" font-size="18" font-weight="normal" fill="#DFBD69" text-anchor="middle" letter-spacing="3">ARAF-MARKET</text>
  </g>
  
  <!-- Design 6: Integrated Lettermark -->
  <g transform="translate(800, 400)">
    <!-- Clean Background -->
    <rect x="0" y="0" width="250" height="250" rx="10" fill="#FFFFFF" filter="drop-shadow(0px 5px 15px rgba(0,0,0,0.15))" />
    
    <!-- Integrated Letters -->
    <g transform="translate(125, 125)">
      <text x="-75" y="0" font-family="Raleway, sans-serif" font-size="70" font-weight="700" fill="#333333" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="-25" y="0" font-family="Raleway, sans-serif" font-size="70" font-weight="300" fill="#666666" text-anchor="middle" dominant-baseline="middle">R</text>
      <text x="25" y="0" font-family="Raleway, sans-serif" font-size="70" font-weight="700" fill="#333333" text-anchor="middle" dominant-baseline="middle">A</text>
      <text x="75" y="0" font-family="Raleway, sans-serif" font-size="70" font-weight="300" fill="#666666" text-anchor="middle" dominant-baseline="middle">F</text>
    </g>
    
    <!-- Elegant Horizontal Lines -->
    <rect x="40" y="50" width="170" height="2" fill="#333333" />
    <rect x="40" y="200" width="170" height="2" fill="#333333" />
    
    <!-- Title - Clean Typography -->
    <text x="125" y="230" font-family="Raleway, sans-serif" font-size="18" font-weight="600" fill="#333333" text-anchor="middle">ARAF-MARKET</text>
  </g>
</svg>
