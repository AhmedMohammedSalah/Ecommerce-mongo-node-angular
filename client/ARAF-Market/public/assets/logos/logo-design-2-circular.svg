<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Definitions -->
  <defs>
    <radialGradient id="radial2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#0F2027" />
      <stop offset="70%" style="stop-color:#2C5364" />
    </radialGradient>
  </defs>
  
  <!-- Circular Format -->
  <circle cx="100" cy="100" r="100" fill="url(#radial2)" />
  <text x="100" y="100" font-family="Helvetica Neue, sans-serif" font-size="65" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>
  <text x="100" y="130" font-family="Helvetica Neue, sans-serif" font-size="18" font-weight="500" fill="white" text-anchor="middle" letter-spacing="4">RAF</text>
  <g transform="translate(100, 100)">
    <!-- Cart Icon -->
    <g transform="translate(0, -50)">
      <path d="M-10,-5 L10,-5 L7,5 L-7,5 Z" fill="white" opacity="0.7"/>
      <circle cx="-5" cy="8" r="2" fill="white" opacity="0.7"/>
      <circle cx="5" cy="8" r="2" fill="white" opacity="0.7"/>
    </g>
    <!-- Package Icon -->
    <g transform="translate(50, 0)">
      <rect x="-8" y="-5" width="16" height="10" fill="white" opacity="0.7"/>
      <path d="M-8,-5 L0,-10 L8,-5" fill="white" opacity="0.7"/>
    </g>
    <!-- Tracking Path -->
    <path d="M-70,30 C-40,20 0,40 40,30" fill="none" stroke="white" stroke-width="2" opacity="0.5" stroke-dasharray="2,2"/>
  </g>
  <text x="100" y="180" font-family="Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">ARAF-MARKET</text>
</svg>
