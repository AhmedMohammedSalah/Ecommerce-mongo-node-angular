<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43cea2" />
      <stop offset="100%" style="stop-color:#185a9d" />
    </linearGradient>
  </defs>
  
  <!-- Circular Format -->
  <circle cx="100" cy="100" r="100" fill="url(#gradient3)" />
  <text x="100" y="95" font-family="Futura, sans-serif" font-size="60" font-weight="700" fill="white" text-anchor="middle">A</text>
  <text x="100" y="125" font-family="Futura, sans-serif" font-size="20" font-weight="500" fill="white" text-anchor="middle" letter-spacing="3">RAF</text>
  <g transform="translate(100, 100)">
    <!-- E-commerce Icons Around Circle -->
    <g transform="translate(0, -65)">
      <path d="M-8,-4 L8,-4 L6,4 L-6,4 Z" fill="white" opacity="0.8"/>
      <circle cx="-4" cy="8" r="2" fill="white" opacity="0.8"/>
      <circle cx="4" cy="8" r="2" fill="white" opacity="0.8"/>
    </g>
    <g transform="translate(65, 0)">
      <rect x="-6" y="-6" width="12" height="12" fill="white" opacity="0.8"/>
      <path d="M-6,-6 L0,-10 L6,-6" fill="white" opacity="0.8"/>
    </g>
    <g transform="translate(0, 65)">
      <rect x="-4" y="-8" width="8" height="16" rx="2" fill="white" opacity="0.8"/>
      <circle cx="0" cy="4" r="1" fill="white" opacity="0.8"/>
    </g>
    <g transform="translate(-65, 0)">
      <path d="M-6,-6 L6,6 L2,10 L-10,2 Z" fill="white" opacity="0.8"/>
      <circle cx="-2" cy="-2" r="2" fill="url(#gradient3)" opacity="0.8"/>
    </g>
    <circle cx="0" cy="0" r="65" fill="none" stroke="white" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
  </g>
  <text x="100" y="180" font-family="Futura, sans-serif" font-size="16" font-weight="500" fill="white" text-anchor="middle">ARAF-MARKET</text>
</svg>
