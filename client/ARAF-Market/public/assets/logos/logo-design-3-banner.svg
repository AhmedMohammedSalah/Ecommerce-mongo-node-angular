<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43cea2" />
      <stop offset="100%" style="stop-color:#185a9d" />
    </linearGradient>
  </defs>
  
  <!-- Banner Format -->
  <rect x="0" y="0" width="400" height="100" rx="10" fill="url(#gradient3)" />
  <text x="100" y="65" font-family="Futura, sans-serif" font-size="50" font-weight="700" fill="white" text-anchor="middle">A</text>
  <text x="100" y="90" font-family="Futura, sans-serif" font-size="16" font-weight="500" fill="white" text-anchor="middle" letter-spacing="3">RAF</text>
  <!-- E-commerce Icons in Row -->
  <g transform="translate(180, 50)">
    <path d="M-8,-4 L8,-4 L6,4 L-6,4 Z" fill="white" opacity="0.8"/>
    <circle cx="-4" cy="8" r="2" fill="white" opacity="0.8"/>
    <circle cx="4" cy="8" r="2" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(240, 50)">
    <rect x="-6" y="-6" width="12" height="12" fill="white" opacity="0.8"/>
    <path d="M-6,-6 L0,-10 L6,-6" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(300, 50)">
    <rect x="-4" y="-8" width="8" height="16" rx="2" fill="white" opacity="0.8"/>
    <circle cx="0" cy="4" r="1" fill="white" opacity="0.8"/>
  </g>
  <g transform="translate(360, 50)">
    <path d="M-6,-6 L6,6 L2,10 L-10,2 Z" fill="white" opacity="0.8"/>
    <circle cx="-2" cy="-2" r="2" fill="url(#gradient3)" opacity="0.8"/>
  </g>
  <text x="250" y="35" font-family="Futura, sans-serif" font-size="24" font-weight="500" fill="white" text-anchor="middle">ARAF-MARKET</text>
</svg>
